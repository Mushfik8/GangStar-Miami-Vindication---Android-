plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gangstar.miami'
    compileSdk 34

    defaultConfig {
        applicationId "com.gangstar.miami"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.9"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
